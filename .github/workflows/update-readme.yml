name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          DATA_FILE = Path("data/conferences.json")
          README_FILE = Path("README.md")

          START = "<!-- UPCOMING_CONFERENCES_START -->"
          END = "<!-- UPCOMING_CONFERENCES_END -->"

          with DATA_FILE.open(encoding="utf-8") as f:
              data = json.load(f)

          today = date.today()
          events = []

          for conference in data:
              name = conference["name"]

              for edition in conference.get("editions", []):
                  start = date.fromisoformat(edition["start_date"])
                  end = date.fromisoformat(
                      edition.get("end_date", edition["start_date"])
                  )

                  if end < today:
                      continue

                  events.append({
                      "name": f'{name} {edition["year"]}',
                      "start": start,
                      "end": end,
                      "city": edition.get("city", ""),
                      "venue": edition.get("venue", ""),
                      "link": edition.get("link", ""),
                  })

          events.sort(key=lambda x: x["start"])

          def format_date(event):
              start = event["start"]
              end = event["end"]

              if start == end:
                  return start.strftime("%b %-d, %Y")

              if start.year == end.year and start.month == end.month:
                  return f"{start.strftime('%b %-d')}–{end.strftime('%-d, %Y')}"

              return f"{start.strftime('%b %-d, %Y')}–{end.strftime('%b %-d, %Y')}"

          rows = [
              "| Date | Conference | City | Venue |",
              "|---|---|---|---|",
          ]

          for event in events:
              name = event["name"]

              if event["link"]:
                  name = f"[{name}]({event['link']})"

              rows.append(
                  f"| {format_date(event)} "
                  f"| {name} "
                  f"| {event['city']} "
                  f"| {event['venue']} |"
              )

          table = "\n".join(rows)

          readme = README_FILE.read_text(encoding="utf-8")

          start_index = readme.find(START)
          end_index = readme.find(END)

          if start_index == -1 or end_index == -1:
              raise SystemExit(
                  "README.md is missing the conference table markers."
              )

          content = (
              readme[:start_index + len(START)]
              + "\n"
              + table
              + "\n"
              + readme[end_index:]
          )

          README_FILE.write_text(content, encoding="utf-8")
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "docs: update upcoming conferences"
            git push
          fi

  deploy:
    needs: update-readme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4