name: Update Conference Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch conferences and update README
        run: |
          python <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import date

          URL = "https://goescat.github.io/Taiwan-Tech-Conferences/data/conferences.json"

          with urllib.request.urlopen(URL) as response:
              conferences = json.load(response)

          today = date.today().isoformat()
          events = []

          for conference in conferences:
              for edition in conference.get("editions", []):
                  start_date = edition["start_date"]

                  # Only include upcoming conferences
                  if start_date < today:
                      continue

                  events.append({
                      "name": conference["name"],
                      "year": edition["year"],
                      "start_date": start_date,
                      "end_date": edition["end_date"],
                      "city": edition.get("city", ""),
                      "venue": edition.get("venue", ""),
                      "link": edition.get("link", "")
                  })

          # Newest upcoming event first
          events.sort(key=lambda x: x["start_date"])

          rows = [
              "## Upcoming Conferences",
              "",
              "| Conference | Year | Date | City | Venue |",
              "|---|---:|---|---|---|"
          ]

          for event in events:
              name = event["name"]

              if event["link"]:
                  name = f"[{name}]({event['link']})"

              start = event["start_date"]
              end = event["end_date"]

              if start == end:
                  date_text = start
              else:
                  date_text = f"{start} – {end}"

              rows.append(
                  f"| {name} | {event['year']} | "
                  f"{date_text} | {event['city']} | {event['venue']} |"
              )

          new_section = "\n".join(rows)

          readme_path = Path("README.md")
          readme = readme_path.read_text()

          marker_start = "<!-- CONFERENCES:START -->"
          marker_end = "<!-- CONFERENCES:END -->"

          generated = (
              f"{marker_start}\n"
              f"{new_section}\n"
              f"{marker_end}"
          )

          if marker_start in readme and marker_end in readme:
              start_index = readme.index(marker_start)
              end_index = readme.index(marker_end) + len(marker_end)

              readme = (
                  readme[:start_index]
                  + generated
                  + readme[end_index:]
              )
          else:
              readme += "\n\n" + generated + "\n"

          readme_path.write_text(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: update upcoming conferences"
            git push
          fi
